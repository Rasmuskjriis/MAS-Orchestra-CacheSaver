data:
  tokenizer: null
  use_shm: false
  train_files: data/browse_comp/train_subset_1066.parquet
  val_files: data/browse_comp/test_subset_200.parquet
  raw_data: true
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 15000
  max_response_length: 8192
  max_validation_prompt_length: 15000
  train_batch_size: 64
  val_batch_size: null
  return_raw_input_ids: false
  return_raw_chat: false
  return_full_prompt: false
  shuffle: true
  filter_overlong_prompts: false
  filter_overlong_prompts_workers: 1
  truncation: error
  image_key: images
  video_key: videos
  trust_remote_code: false
  custom_cls:
    path: null
    name: null
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen2.5-7B-Instruct
    use_shm: false
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: true
    enable_activation_offload: true
    use_remove_padding: true
    lora_rank: 0
    lora_alpha: 16
    target_modules: all-linear
    use_liger: false
    use_fused_kernels: false
    trust_remote_code: false
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 32768
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    entropy_coeff: 0
    use_kl_loss: true
    use_torch_compile: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    checkpoint:
      contents:
      - model
      - optimizer
      - extra
    optim:
      lr: 1.0e-06
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      num_cycles: 0.5
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: true
      optimizer_offload: true
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: true
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
  rollout:
    name: vllm
    mode: sync
    chat_scheduler: null
    temperature: 1.0
    top_k: -1
    top_p: 1
    use_fire_sampling: false
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    load_format: dummy_dtensor
    layered_summon: false
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: true
    enable_chunked_prefill: false
    do_sample: true
    'n': 32
    engine_kwargs:
      vllm:
        swap_space: null
      sglang:
        attention_backend: null
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0.5
      'n': 8
      do_sample: true
    multi_turn:
      enable: false
      max_turns: null
      tool_config_path: null
      format: chatml
critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp
  optim:
    lr: 1.0e-05
    lr_warmup_steps_ratio: 0.0
    min_lr_ratio: null
    warmup_style: constant
    total_training_steps: -1
    weight_decay: 0.01
  model:
    path: ${actor_rollout_ref.model.path}
    use_shm: false
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: {}
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: true
    enable_activation_offload: true
    use_remove_padding: true
    trust_remote_code: ${actor_rollout_ref.model.trust_remote_code}
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      offload_policy: false
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1
    lora_rank: 0
    lora_alpha: 16
    target_modules: all-linear
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
  checkpoint:
    contents:
    - model
    - optimizer
    - extra
reward_model:
  enable: false
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    use_shm: false
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: true
    use_fused_kernels: ${actor_rollout_ref.model.use_fused_kernels}
    trust_remote_code: false
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: true
      reshard_after_forward: true
      fsdp_size: -1
  micro_batch_size: null
  micro_batch_size_per_gpu: null
  max_length: null
  ulysses_sequence_parallel_size: 1
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward_manager: naive
  launch_reward_fn_async: false
  sandbox_fusion:
    url: null
    max_concurrent: 64
custom_reward_function:
  path: null
  name: compute_score
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: false
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0
trainer:
  val_generations_to_log_to_wandb: 1000000000000000000
  train_generations_to_log_to_wandb: 1000000000000000000
  balance_batch: true
  total_epochs: 30
  total_training_steps: null
  project_name: mas_r1
  experiment_name: harmony_medium_grpo_7b_gpt_oss_120b_browse_comp_plus
  logger:
  - console
  - wandb
  log_val_generations: 0
  rollout_data_dir: null
  validation_data_dir: null
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: 10
  resume_mode: auto
  resume_from_path: null
  val_before_train: true
  test_freq: 5
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
  ray_wait_register_center_timeout: 300
  device: cuda
  remove_previous_ckpt_in_save: true
ray_init:
  num_cpus: null
azr:
  seed: 1
  problem_type: igsm_depth
  dataset_name: math
  mas_r1:
    no_decompose: false
    num_executions: 1
    enable_tree_architecture: false
    sub_agents_per_sub_task: 3
    fix_num_rollout: null
    code_execution_timeout: null
    diff_based_reward: false
    expansive_group: false
    unified_group: false
    disable_hierarchical_reward: false
    mock_output: false
    mock_score: false
    mock_sub_task_sub_agent: false
    full_sampling_mean_at_k: false
    mean_at_k_size: 4
    max_ray_workers: 1
    multiply_processes: 0
    add_judge: false
    eval_building_blocks: false
    known_prompt: null
    use_llm_judge: true
    agent:
      reasoning_effort: low
      max_concurrent: 128
      retrieval_method: bm25
      web_search_type: offline
      model_name: gpt-oss-120b
      api_base: null
      temperature: 0.5
      max_tokens: null
      max_round: 5
      max_sc: 5
      decompose_only: false
      architecture_only: false
      architecture_only_sequential: false
      init_archive:
      - COT
      - COT_SC
      - Reflexion
      - LLM_debate
      - WebSearch
      include_blocks: false
      model_sampler_map:
        gpt-4o:
          type: ChatCompletionSampler
          model: gpt-4o
        gpt-4.1:
          type: ChatCompletionSampler
          model: gpt-4.1
        gpt-4.1-nano:
          type: ChatCompletionSampler
          model: gpt-4.1-nano
        gpt-5-nano:
          type: ChatCompletionSampler
          model: gpt-5-nano
        llama-3.3-70b-instr:
          type: TogetherCompletionSampler
          model: meta-llama/Llama-3.3-70B-Instruct-Turbo
        gpt-oss-120b:
          type: TogetherCompletionSampler
          model: openai/gpt-oss-120b
        qwen-2.5-32b-instr:
          type: VLLMCompletionSampler
          model: qwen-2.5-32b-instr
        qwen-2.5-7b-instr:
          type: TogetherCompletionSampler
          model: Qwen/Qwen2.5-7B-Instruct-Turbo
        qwen-2.5-72b-instr:
          type: TogetherCompletionSampler
          model: Qwen/Qwen2.5-72B-Instruct-Turbo
    code_saving:
      save_generated_code: true
      max_accumulated_steps: 50
      save_code_summary: true
    dataset:
      templates: {}
    code_extraction:
      code_block_markers:
      - '```python'
      - '```'
      fallback_to_full_response: true
    execution:
      use_sandbox: false
      allow_network: false
      max_memory: 512
      allowed_modules:
      - math
      - numpy
      - pandas
      - scipy
      - sklearn
    logging:
      log_generated_code: true
      log_execution_results: true
      log_execution_errors: true
      save_intermediate_results: true
    execution_success_weight: 0.0
    final_answer_weight: 1.0
    gsm8k:
      extract_ground_truth_from: reward_model
      ground_truth_key: ground_truth
      answer_key: answer
      question_key: question
